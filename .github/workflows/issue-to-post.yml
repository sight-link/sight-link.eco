name: Issue to post

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: issue-to-post
  cancel-in-progress: false

jobs:
  publish:
    # Only the repository owner can publish. Anyone else opening an issue is ignored.
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Append post to updates.json
        id: post
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/issue_to_post.py

      - name: Commit and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if [ -d images ]; then git add images; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add post from issue"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Confirm on issue
        if: success() && steps.post.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SITE_URL: https://eco.sightlink.workers.dev/
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "已写入 updates.json 并推送，网站约 1 分钟内自动更新：$SITE_URL"
          gh issue close "$ISSUE_NUMBER"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "自动发布失败，请到 Actions 日志查看原因（常见：updates.json 格式错误）。修复后重新新建一条 issue 即可。"
