<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update · Sight-link.eco</title>
<meta name="description" content="A update from Xiaofei's log.">
<style>
  :root {
    --bg: #fafaf9;
    --text: #111111;
    --muted: #6b6b6b;
    --accent: #f97316;
    --border: #e5e5e3;
    --card: #ffffff;
    --post-link: #0b83ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 24px; }

  header { padding: 56px 0 28px; }
  .logo {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 15px; letter-spacing: 0.5px;
    color: var(--text); text-decoration: none; margin-bottom: 32px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .back { font-size: 13px; color: var(--post-link); text-decoration: none; }
  .back:hover { text-decoration: underline; }

  .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .date { font-size: 13.6px; color: var(--muted); }
  .tag {
    font-size: 11px; font-weight: 700; border-radius: 999px;
    background: #fff7ed; color: var(--accent); padding: 1px 8px;
  }
  h1 {
    font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: -0.4px;
    overflow-wrap: anywhere; margin-bottom: 26px;
  }
  .body { font-size: 16px; line-height: 1.8; white-space: pre-line; margin-bottom: 26px; overflow-wrap: anywhere; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 26px; }
  .gallery img {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
    border-radius: 8px; border: 1px solid var(--border); background: #edf0f2;
    cursor: zoom-in;
  }
  .gallery img:hover { border-color: var(--accent); }
  .external {
    display: inline-block; font-size: 14px; color: var(--post-link);
    text-decoration: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 18px; margin-bottom: 28px; background: var(--card);
  }
  .external:hover { border-color: var(--post-link); }

  nav {
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-top: 1px solid var(--border); padding-top: 20px; padding-bottom: 56px;
  }
  nav a { font-size: 14px; color: var(--post-link); text-decoration: none; max-width: 46%; }
  nav a:hover { text-decoration: underline; }
  nav .nav-label { display: block; font-size: 12px; color: var(--muted); }
  nav .nav-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer {
    border-top: 1px solid var(--border); padding: 32px 0 48px;
    font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  .lightbox {
    position: fixed; inset: 0; background: rgba(17,17,17,.88); z-index: 99;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    padding: 40px 20px;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 6px; }
  .lightbox .ctrl { display: flex; align-items: center; gap: 20px; color: #fff; font-size: 14px; }
  .lightbox button {
    background: none; border: 1px solid rgba(255,255,255,.4); color: #fff;
    border-radius: 999px; padding: 6px 16px; font-size: 14px; cursor: pointer;
  }
  .lightbox button:hover { border-color: #fff; }
  .lightbox .close { position: absolute; top: 18px; right: 20px; font-size: 22px; border: 0; padding: 4px 10px; }

  .hint { color: var(--muted); font-size: 14px; padding: 60px 0; }
  @media (max-width: 600px) {
    header { padding-top: 40px; }
    h1 { font-size: 22px; }
    .body { font-size: 15px; }
    .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html"><span class="dot"></span>SIGHT-LINK.ECO</a>
    <div><a class="back" href="index.html#posts">← 01 Updates</a></div>
  </header>
  <main id="detail"><div class="hint">Loading…</div></main>
  <footer>
    <span>© 2026 Xiaofei · Sight-link.eco</span>
    <a href="index.html#top">Back to top ↑</a>
  </footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer">
  <button class="close" type="button" aria-label="Close">×</button>
  <img id="lb-img" alt="">
  <div class="ctrl">
    <button type="button" id="lb-prev">← Prev</button>
    <span id="lb-count"></span>
    <button type="button" id="lb-next">Next →</button>
  </div>
</div>

<script>
  const esc = s => String(s ?? "").replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function fmtDate(d) {
    const [y, m, day] = String(d).split("-");
    const thisYear = String(new Date().getFullYear());
    return `${+day} ${MONTHS[+m - 1]}${y === thisYear ? "" : " '" + y.slice(2)}`;
  }

  // Stable id derived from date + text, so links survive reordering.
  function postId(it) {
    const s = String(it.date) + "|" + String(it.text);
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return String(it.date) + "-" + (h >>> 0).toString(16).padStart(8, "0");
  }

  function imagesOf(it) {
    if (Array.isArray(it.images) && it.images.length) return it.images.filter(Boolean);
    if (it.image) return [it.image];
    const stray = Object.keys(it).find(k => /^images?\//i.test(k));
    return stray ? [stray] : [];
  }

  let gallery = [], current = 0;
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbCount = document.getElementById("lb-count");

  function showImage(i) {
    if (!gallery.length) return;
    current = (i + gallery.length) % gallery.length;
    lbImg.src = gallery[current];
    lbImg.alt = "Image " + (current + 1);
    lbCount.textContent = (current + 1) + " / " + gallery.length;
  }
  function openLightbox(i) { showImage(i); lb.classList.add("show"); }
  function closeLightbox() { lb.classList.remove("show"); lbImg.src = ""; }

  lb.querySelector(".close").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", () => showImage(current - 1));
  document.getElementById("lb-next").addEventListener("click", () => showImage(current + 1));
  lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("show")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") showImage(current - 1);
    if (e.key === "ArrowRight") showImage(current + 1);
  });

  function render(posts, post) {
    const sorted = posts.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const idx = sorted.findIndex(x => postId(x) === postId(post));
    const prev = idx > 0 ? sorted[idx - 1] : null;
    const next = idx < sorted.length - 1 ? sorted[idx + 1] : null;

    gallery = imagesOf(post);
    const images = gallery.map((src, i) =>
      `<img src="${esc(src)}" alt="${esc(post.text)} — ${i + 1}" data-i="${i}" loading="lazy">`).join("");
    const external = post.link
      ? `<a class="external" href="${esc(post.link)}" target="_blank" rel="noopener">View original ↗</a>` : "";
    const body = post.body ? `<div class="body">${esc(post.body)}</div>` : "";
    const navLinks =
      (prev || next) ? `<nav>
        ${prev ? `<a href="post.html?id=${encodeURIComponent(postId(prev))}"><span class="nav-label">← Previous</span><span class="nav-title">${esc(prev.text)}</span></a>` : "<span></span>"}
        ${next ? `<a href="post.html?id=${encodeURIComponent(postId(next))}" style="text-align:right"><span class="nav-label">Next →</span><span class="nav-title">${esc(next.text)}</span></a>` : "<span></span>"}
      </nav>` : "";

    document.getElementById("detail").innerHTML = `
      <div class="meta">
        <span class="date">${fmtDate(post.date)}</span>
        ${post.tag ? `<span class="tag">${esc(post.tag)}</span>` : ""}
      </div>
      <h1>${esc(post.text)}</h1>
      ${body}
      ${gallery.length ? `<div class="gallery">${images}</div>` : ""}
      ${external}
      ${navLinks}`;

    document.querySelectorAll(".gallery img").forEach(img => {
      img.addEventListener("click", () => openLightbox(+img.dataset.i));
      img.addEventListener("error", () => { img.style.display = "none"; });
    });
    lbImg.addEventListener("error", () => { lbImg.style.display = "none"; });
    lbImg.addEventListener("load", () => { lbImg.style.display = "block"; });
    document.title = String(post.text).slice(0, 60) + " · Sight-link.eco";
  }

  async function load() {
    try {
      const res = await fetch("updates.json");
      if (!res.ok) throw new Error(res.status);
      const posts = await res.json();
      const id = new URLSearchParams(location.search).get("id");
      const post = posts.find(x => postId(x) === id);
      if (!post) throw new Error("not found");
      render(posts, post);
    } catch (e) {
      document.getElementById("detail").innerHTML =
        '<div class="hint">This update was not found. <a href="index.html#posts">Back to all updates →</a></div>';
    }
  }
  load();
</script>
</body>
</html>
